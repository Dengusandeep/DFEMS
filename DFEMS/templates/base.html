<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFEMS - Digital Forensics System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Orbitron & Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="navbar glass-effect">
        <div class="logo-3d-wrapper">
            <a href="/" class="logo logo-3d" aria-label="Home">
                <span data-text="D">D</span><span data-text="F">F</span><span data-text="E">E</span><span
                    data-text="M">M</span><span data-text="S">S</span>
            </a>
        </div>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
            <a href="/dashboard">Dashboard</a>
            <a href="/cases">Cases</a>
            <a href="/logout">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
