{% extends "base.html" %}
{% block content %}

<div class="login-container glass-effect">
    <div class="login-title-3d">
        <div class="hologram-text" data-heading="DFEMS">DFEMS</div>
    </div>
    <h3 style="margin-top:0; color:var(--text-muted); font-family:'Inter',sans-serif; font-weight:400; font-size:16px;">
        Secure Authentication</h3>

    <form method="POST">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="agent@dfems.gov" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 16px;">AUTHORIZE</button>
    </form>

    <div style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <p style="margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">Don't have clearance?</p>
        <a href="/register" style="text-decoration:none; display:block;">
            <button
                style="background: rgba(30,41,59,0.8); border: 1px solid var(--border-color); color: var(--text-main); width: 100%; box-shadow:none;">REQUEST
                ACCESS</button>
        </a>
    </div>
</div>

{% endblock %}
